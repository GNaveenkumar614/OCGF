# MTrans teacher v1: multi-class, 500 labelled KITTI frames, unlabelled objects from the zero-shot detector.
# Model and training values follow the original configs/MTrans_kitti.yaml of MTrans unless noted.
experiment: mtrans_v1
seed: 7489
classes: [car, large_vehicle, pedestrian, cyclist]
labelled_frames: configs/splits/kitti_object/mtrans_labelled_500.txt   # S1 ablation: mtrans_labelled_125.txt

data:
  out_img_size: 112
  out_cloud_size: 512
  train_mask_ratio: [0.0, 0.95]
  box2d_augmentation: true       # OCGF: mimics detector box noise (original default: false)
  max_truncation: 0.95
  min_points: 5                  # frustum points an object needs to enter a pool
  min_foreground: 5              # labelled objects: points inside the 3D box (as the original filter)
  unlabelled_min_score: 0.5      # OCGF: detector score for unlabelled objects (the original used label_2 boxes)
  class_balance_power: 0.5       # OCGF: labelled objects drawn with weight n_class^-0.5; 0 = no balancing

train:
  epochs: 100                    # OCGF (decided 2026-10-21): the original's 300 would take about 41 h on one T4;
                                 # the first run started with 300 and was re-planned to 100 when it resumed
  lr: 1.0e-4
  warmup_rate: 0.01
  batch_size: 8
  unlabelled_batch_size: 8
  eval_batch_size: 32
  eval_every: 25                 # validation for reporting only; it never selects the checkpoint
  log_every: 200
  num_workers: 4
  amp: false                     # OCGF: mixed precision (fp16 forward, fp32 loss) on GPU; the original trains in fp32

model:
  mask_and_jitter: true
  sparse_query_rate: 4
  patch_size: 7
  box_drop: 0.1
  class_embedding_dim: 32        # OCGF: class input of the box and confidence heads
  POINT_ATTENTION:
    use_cls_token: true
    fore_attn: false
    num_layers: 4
    pos_embedding: SIN
    fuse_method: CAT
    input_img_channel: 512
    input_pts_channel: 512
    position_embedding_channel: 512
    hidden_size: 768
    num_heads: 12
    dropout_rate: 0.2
    intermediate_size: 1024
