# Student training v1, shared by every experiment (fair comparisons: same encoders, splits, budget and grid).
# An experiment config names this file under `base:` and overrides keys.
seed: 0
targets: bev_targets_v1.yaml          # BEV inputs and targets config, relative to this folder
model:
  mode: concat                        # camera_ipm (E0a) | camera | lidar (E0b) | concat (E0c)
  channels: 64
  backbone: dinov2_vits14_reg         # frozen, self-supervised (Apache-2.0); "stub" for CPU smoke runs
objects:                              # how MTrans objects enter (see ocgf/training/experiment.py)
  inputs: false                       # object channels O_B into the model
  occluders: false                    # box tops occlude in the student's viewshed (A3 turns this off)
  targets: false                      # strict boxes as occupancy pseudo-labels
loss:
  road: 1.0
  occ: 1.0
  unk: 0.5
  aux: 0.2                            # auxiliary road heads on F_C / F_L (H_cam comes from the camera one)
  boundary: 0.5                       # road BCE weighted near the road target's 0.5 contour
  boundary_sigma: 0.5                 # m
  cross: 0.1                          # cross-modal consistency of the auxiliary heads (self-supervised; S3 turns off)
  temporal: 0.1                       # temporal consistency with the previous 5 m frame (self-supervised; S3 turns off)
train:
  epochs: 30                          # placeholder: fix the budget after the first timed run (plan: P1)
  batch_size: 4
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_steps: 200
  num_workers: 4
  amp: true
  log_every: 50
  time_budget_hours: 11.0
