# KITTI-360 download links used by the data-prep notebook.
# The data is licensed CC BY-NC-SA 3.0 (non-commercial). Register at cvlibs.net and accept the KITTI-360 terms
# before downloading. This repository never contains the data itself.

# Paper split kitti360_paper_v1 (configs/splits/, decided 2026-10-18):
#   train 0000, 0002, 0004, 0005 · val 0006 · test 0009, 0010 · unused 0003, 0007 (links kept for completeness).
# Drive 0000 takes its images from the Kaggle starter and keeps every frame; the other drives take them from the
# image_00 zips below and keep one usable frame every 2.5 m, read remotely, so only about a quarter of a zip is fetched.

# raw Velodyne scans, one zip per sequence (the nine training drives)
velodyne:
